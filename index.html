<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Money Manager</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

.summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
}

.card {
    background: #eeeeee;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    box-sizing: border-box;
}

button {
    background: #222;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.transaction {
    background: #eeeeee;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
}

.monthly {
    background: #f7f7f7;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

.editing {
    background: #fff3cd;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 My Money Manager</h1>

<div class="summary">

    <div class="card">
        <b>Income</b>
        <div id="income">0 Ks</div>
    </div>

    <div class="card">
        <b>Expense</b>
        <div id="expense">0 Ks</div>
    </div>

    <div class="card">
        <b>Balance</b>
        <div id="balance">0 Ks</div>
    </div>

</div>


<h3>Add Transaction</h3>

<label>Date</label>
<input type="date" id="date">

<label>Type</label>
<select id="type">
    <option value="income">Income</option>
    <option value="expense">Expense</option>
</select>

<label>Category</label>
<select id="category">
    <option value="Salary">Salary</option>
    <option value="Other">Other</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Shopping">Shopping</option>
    <option value="Bills">Bills</option>
</select>

<label>Amount</label>
<input type="number" id="amount" placeholder="Enter amount">

<label>Note</label>
<input type="text" id="note" placeholder="Optional">

<button id="mainButton" onclick="addTransaction()">
    Add Transaction
</button>


<!-- MONTHLY SUMMARY -->

<div class="monthly">

    <h3>📅 Monthly Summary</h3>

    <label>Select Month</label>

    <input
        type="month"
        id="month"
        onchange="monthlySummary()"
    >

    <div id="monthlyResult">
        Select a month to see summary.
    </div>

</div>


<!-- EXPENSE CATEGORY SUMMARY -->

<div class="monthly">

    <h3>📊 Expense by Category</h3>

    <div id="categoryResult">
        Select a month above.
    </div>

</div>


<!-- TRANSACTIONS -->

<h3>Transactions</h3>

<select id="filter" onchange="displayTransactions()">
    <option value="all">All</option>
    <option value="income">Income</option>
    <option value="expense">Expense</option>
</select>

<input
    type="text"
    id="search"
    placeholder="🔎 Search transaction..."
    oninput="displayTransactions()"
>

<div id="transactions"></div>

</div>


<script>

let transactions =
JSON.parse(
    localStorage.getItem("moneyTransactions")
) || [];

let editingIndex = -1;


/* ADD / EDIT TRANSACTION */

function addTransaction() {

    const date =
        document.getElementById("date").value;

    const type =
        document.getElementById("type").value;

    const category =
        document.getElementById("category").value;

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const note =
        document.getElementById("note").value;


    if (!date) {
        alert("Please select a date.");
        return;
    }

    if (amount <= 0) {
        alert("Please enter a valid amount.");
        return;
    }


    if (editingIndex === -1) {

        transactions.push({
            date,
            type,
            category,
            amount,
            note
        });

    } else {

        transactions[editingIndex] = {
            date,
            type,
            category,
            amount,
            note
        };

        editingIndex = -1;

        document.getElementById("mainButton").textContent =
            "Add Transaction";
    }


    localStorage.setItem(
        "moneyTransactions",
        JSON.stringify(transactions)
    );


    clearForm();

    displayTransactions();
    monthlySummary();
}


/* EDIT TRANSACTION */

function editTransaction(index) {

    const t = transactions[index];

    document.getElementById("date").value =
        t.date;

    document.getElementById("type").value =
        t.type;

    document.getElementById("category").value =
        t.category;

    document.getElementById("amount").value =
        t.amount;

    document.getElementById("note").value =
        t.note;


    editingIndex = index;


    document.getElementById("mainButton").textContent =
        "Save Changes";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* CLEAR FORM */

function clearForm() {

    document.getElementById("amount").value = "";

    document.getElementById("note").value = "";

    document.getElementById("date").value = "";

    document.getElementById("type").value = "income";

    document.getElementById("category").value = "Salary";
}


/* DISPLAY TRANSACTIONS */

function displayTransactions() {

    let income = 0;
    let expense = 0;

    const box =
        document.getElementById("transactions");

    box.innerHTML = "";


    const filter =
        document.getElementById("filter").value;

    const search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();


    transactions.forEach(function(t, index) {

        /* TOTAL SUMMARY */

        if (t.type === "income") {
            income += t.amount;
        }

        if (t.type === "expense") {
            expense += t.amount;
        }


        /* FILTER */

        if (
            filter !== "all" &&
            t.type !== filter
        ) {
            return;
        }


        /* SEARCH */

        const searchText =
            (
                t.date + " " +
                t.type + " " +
                t.category + " " +
                t.amount + " " +
                t.note
            ).toLowerCase();


        if (
            search !== "" &&
            !searchText.includes(search)
        ) {
            return;
        }


        /* SHOW TRANSACTION */

        box.innerHTML += `

        <div class="transaction">

            <b>${t.date}</b><br>

            ${t.type.toUpperCase()}
            - ${t.category}<br>

            ${t.amount.toLocaleString()} Ks<br>

            ${t.note || ""}

            <button onclick="editTransaction(${index})">
                Edit
            </button>

            <button onclick="deleteTransaction(${index})">
                Delete
            </button>

        </div>

        `;

    });


    /* BALANCE */

    const balance =
        income - expense;


    document.getElementById("income").textContent =
        income.toLocaleString() + " Ks";

    document.getElementById("expense").textContent =
        expense.toLocaleString() + " Ks";

    document.getElementById("balance").textContent =
        balance.toLocaleString() + " Ks";
}


/* MONTHLY SUMMARY */

function monthlySummary() {

    const selectedMonth =
        document.getElementById("month").value;


    if (!selectedMonth) {

        document.getElementById(
            "monthlyResult"
        ).innerHTML =
            "Select a month to see summary.";

        document.getElementById(
            "categoryResult"
        ).innerHTML =
            "Select a month above.";

        return;
    }


    let income = 0;
    let expense = 0;

    let categories = {};


    transactions.forEach(function(t) {

        if (
            t.date.startsWith(selectedMonth)
        ) {

            if (t.type === "income") {
                income += t.amount;
            }


            if (t.type === "expense") {

                expense += t.amount;


                if (!categories[t.category]) {
                    categories[t.category] = 0;
                }


                categories[t.category] +=
                    t.amount;
            }

        }

    });


    const balance =
        income - expense;


    document.getElementById(
        "monthlyResult"
    ).innerHTML = `

        <p>
            <b>Month:</b>
            ${selectedMonth}
        </p>

        <p>
            💰 Income:
            <b>${income.toLocaleString()} Ks</b>
        </p>

        <p>
            💸 Expense:
            <b>${expense.toLocaleString()} Ks</b>
        </p>

        <p>
            📊 Balance:
            <b>${balance.toLocaleString()} Ks</b>
        </p>

    `;


    let categoryHTML = "";


    const categoryNames =
        Object.keys(categories);


    if (categoryNames.length === 0) {

        categoryHTML =
            "No expenses for this month.";

    } else {

        categoryNames.forEach(
            function(category) {

                categoryHTML += `

                <p>
                    <b>${category}</b>:
                    ${categories[category]
                        .toLocaleString()} Ks
                </p>

                `;

            }
        );

    }


    document.getElementById(
        "categoryResult"
    ).innerHTML =
        categoryHTML;
}


/* DELETE TRANSACTION */

function deleteTransaction(index) {

    transactions.splice(index, 1);


    localStorage.setItem(
        "moneyTransactions",
        JSON.stringify(transactions)
    );


    displayTransactions();
    monthlySummary();
}


/* START APP */

displayTransactions();

</script>

</body>
</html>
