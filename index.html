<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Manager - Liquid Edition</title>

  <style>
    :root {
      --bg: #050811;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.45);
      --expense: #f43f5e;
      --expense-glow: rgba(244, 63, 94, 0.45);
      --debt-lent: #38bdf8;
      --debt-borrow: #f59e0b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 125px;
      overflow-x: hidden;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      position: relative;
    }

    /* Ambient Cyber Lights */
    .ambient-glow-1 {
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      top: -80px;
      left: -80px;
      pointer-events: none;
      z-index: 0;
    }
    .ambient-glow-2 {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      top: 300px;
      right: -80px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Greeting & Streak Status */
    .top-status-bar {
      padding: 18px 20px 6px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .greeting-text {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 600;
    }
    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      color: #fbbf24;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.2);
    }

    /* Header */
    .header {
      padding: 4px 20px 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cycle-badge {
      font-size: 11px;
      color: var(--primary);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Time Filter Bar */
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 6px 18px 12px 18px;
      position: relative;
      z-index: 1;
    }
    .filter-btn {
      padding: 8px 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:active { transform: scale(0.96); }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 12px var(--primary-glow);
    }

    /* Balance Cockpit Card */
    .balance-card {
      margin: 0 18px 16px 18px;
      padding: 22px;
      border-radius: 24px;
      background: radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.18) 0%, rgba(15, 23, 42, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }
    .balance-title {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }
    .balance-num {
      font-size: 32px;
      font-weight: 800;
      margin: 6px 0 10px 0;
      letter-spacing: -0.5px;
    }
    .daily-safe-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat-pill { display: flex; align-items: center; gap: 8px; }
    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }
    .stat-icon.inc { background: rgba(16, 185, 129, 0.15); color: var(--primary); }
    .stat-icon.exp { background: rgba(244, 63, 94, 0.15); color: var(--expense); }
    .stat-label { font-size: 11px; color: var(--text-dim); }
    .stat-val { font-size: 13px; font-weight: 700; margin-top: 2px; }

    /* Survival Mode Alert */
    .survival-banner {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.22), rgba(245, 158, 11, 0.16));
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .survival-banner h4 {
      font-size: 13px;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .survival-banner p { font-size: 11px; color: #cbd5e1; line-height: 1.4; }

    /* Tabs */
    .tab-content { display: none; padding: 0 18px; position: relative; z-index: 1; }
    .tab-content.active { display: block; }

    .glass-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }
    .box-heading {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Type Switcher */
    .type-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(11, 15, 25, 0.7);
      padding: 4px;
      border-radius: 12px;
      gap: 6px;
      margin-bottom: 14px;
    }
    .type-btn {
      padding: 10px;
      border: none;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: all 0.2s;
    }
    .type-btn.active-exp { background: var(--expense); color: #fff; box-shadow: 0 4px 12px var(--expense-glow); }
    .type-btn.active-inc { background: var(--primary); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }
    .type-btn.active-lent { background: var(--debt-lent); color: #fff; }
    .type-btn.active-borrow { background: var(--debt-borrow); color: #fff; }

    /* Inputs */
    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(11, 15, 25, 0.75);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); }

    .quick-chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .chip {
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .chip:active { transform: scale(0.94); }

    .btn-action {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #059669);
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: transform 0.15s;
    }
    .btn-action:active { transform: scale(0.97); }

    /* Transactions */
    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 9px;
      transition: transform 0.15s;
    }
    .tx-left { display: flex; align-items: center; gap: 10px; }
    .tx-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .tx-meta .title { font-size: 13px; font-weight: 700; }
    .tx-meta .subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .tx-right { text-align: right; display: flex; align-items: center; gap: 8px; }
    .tx-amt { font-size: 13px; font-weight: 800; }
    .tx-amt.inc { color: var(--primary); }
    .tx-amt.exp { color: var(--expense); }
    .btn-delete {
      background: transparent;
      border: none;
      color: #475569;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }
